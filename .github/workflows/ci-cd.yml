name: CI/CD Entre Paginas

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-back:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Back
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Back/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas (unitarias + HTTP, sin MySQL)
        run: npm test

  test-front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Front/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Pruebas
        run: npm test
      - name: Build de produccion
        run: npm run build

  snyk:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Instalar Snyk CLI
        run: npm install --global snyk
      - name: Comprobar token
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::Falta el secret SNYK_TOKEN"
            exit 1
          fi
      - name: SCA backend (Snyk Open Source)
        working-directory: Back
        run: snyk test --severity-threshold=high
      - name: SCA frontend (Snyk Open Source)
        working-directory: Front
        run: snyk test --severity-threshold=high
      - name: SAST (Snyk Code)
        run: snyk code test --severity-threshold=high

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test-back, test-front, snyk]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: backend-ec2-production
      cancel-in-progress: false
    steps:
      - name: Obtener credenciales temporales de AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Actualizar EC2 y comprobar el resultado
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          BACKEND_PUBLIC_URL: ${{ vars.BACKEND_PUBLIC_URL }}
        run: |
          set -euo pipefail
          : "${EC2_INSTANCE_ID:?Configurar EC2_INSTANCE_ID}"
          : "${BACKEND_PUBLIC_URL:?Configurar BACKEND_PUBLIC_URL}"

          python3 - <<'PY'
          import json
          import os
          command = (
              'sudo -u ubuntu -H bash '
              '/home/ubuntu/deploy-entre-paginas.sh '
              + os.environ['GITHUB_SHA']
          )
          with open('ssm-commands.json', 'w', encoding='utf-8') as file:
              json.dump({'commands': [command]}, file)
          PY

          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Despliegue Entre Paginas ${GITHUB_SHA}" \
            --parameters file://ssm-commands.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $command_id"

          status=Pending
          for intento in $(seq 1 120); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || true)
            case "$status" in
              Success|Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated|InvalidPlatform|AccessDenied)
                break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
          test "$status" = Success

          curl --fail --silent --show-error --retry 6 --retry-delay 5 \
            "${BACKEND_PUBLIC_URL%/}/api/v1/health"
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            "${BACKEND_PUBLIC_URL%/}/api/v1/products" > /dev/null
