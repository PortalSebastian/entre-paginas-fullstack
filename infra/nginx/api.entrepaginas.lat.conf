# /etc/nginx/sites-available/api.entrepaginas.lat  (enlazado en sites-enabled;
# el sitio `default` se elimino).
#
# Este es el sitio tal como se crea ANTES de Certbot. `sudo certbot --nginx
# -d api.entrepaginas.lat` lo reescribe en la EC2: cambia este bloque a
# `listen 443 ssl` con el certificado de Let's Encrypt y anade un segundo
# `server` en el puerto 80 que redirige (301) a https. Esas lineas llevan el
# comentario `# managed by Certbot` y no se versionan aqui.
#
# HSTS no se configura en Nginx: lo envia la API (helmet).
server {
    listen 80;
    listen [::]:80;
    server_name api.entrepaginas.lat;

    location / {
        proxy_pass http://127.0.0.1:3000;
        include proxy_params;   # Host, X-Real-IP, X-Forwarded-For, X-Forwarded-Proto
    }
}
